$schema: https://json-schema.org/draft/2020-12/schema
title: sample receiver configuration
type: object
properties:
    api_key:
        description: APIKey is a secret API key (opaque string).
        type: string
    batch_size:
        description: BatchSize is the number of items to send in each batch.
        type: integer
    custom_string:
        description: CustomString is a custom string.
        type: string
    enabled:
        description: Enabled controls whether the exporter is active.
        type: boolean
    endpoint:
        description: Endpoint is the target URL to send data to.
        type: string
    endpoints:
        description: Endpoints is a list of endpoint configurations.
        type: array
        items:
            type: object
            properties:
                priority:
                    description: Priority is the endpoint priority.
                    type: integer
                url:
                    description: URL is the endpoint URL.
                    type: string
            additionalProperties: false
    headers:
        description: Headers are additional headers to include in requests.
        type: object
        additionalProperties:
            type: string
    host:
        description: Host is the network host.
        type: string
    id:
        description: ID is the component identifier.
        type: string
    optional_retry:
        description: OptionalRetry is an optional retry configuration.
        type: object
        properties:
            initial_interval:
                description: InitialInterval is the initial retry interval.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            max_retries:
                description: MaxRetries is the maximum number of retries.
                type: integer
        additionalProperties: false
    port:
        description: Port is the network port.
        type: integer
    retry:
        description: Retry contains retry configuration.
        type: object
        properties:
            initial_interval:
                description: InitialInterval is the initial retry interval.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            max_retries:
                description: MaxRetries is the maximum number of retries.
                type: integer
        additionalProperties: false
    secrets:
        description: Secrets is a list of secret key-value pairs.
        type: object
    sending_queue:
        description: QueueConfig defines sending queue.
        type: object
        properties:
            batch:
                description: BatchConfig it configures how the requests are consumed from the queue and batch together during consumption.
                type: object
                properties:
                    flush_timeout:
                        description: FlushTimeout sets the time after which a batch will be sent regardless of its size.
                        type: string
                        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
                    max_size:
                        description: MaxSize defines the configuration for the maximum size of a batch.
                        type: integer
                    min_size:
                        description: MinSize defines the configuration for the minimum size of a batch.
                        type: integer
                    sizer:
                        description: |-
                            Sizer determines the type of size measurement used by this component.
                            It accepts "requests", "items", or "bytes".
                        type: object
                additionalProperties: false
            block_on_overflow:
                description: |-
                    BlockOnOverflow determines the behavior when the component's TotalSize limit is reached.
                    If true, the component will wait for space; otherwise, operations will immediately return a retryable error.
                type: boolean
            enabled:
                description: Enabled indicates whether to not enqueue and batch before exporting.
                type: boolean
            num_consumers:
                description: |-
                    NumConsumers is the maximum number of concurrent consumers from the queue.
                    This applies across all different optional configurations from above (e.g. wait_for_result, block_on_overflow, storage, etc.).
                type: integer
            queue_size:
                description: QueueSize represents the maximum data size allowed for concurrent storage and processing.
                type: integer
            sizer:
                description: |-
                    Sizer determines the type of size measurement used by this component.
                    It accepts "requests", "items", or "bytes".
                type: object
            storage:
                description: |-
                    StorageID if not empty, enables the persistent storage and uses the component specified
                    as a storage extension for the persistent queue.
                    TODO: This will be changed to Optional when available.
                    See https://github.com/open-telemetry/opentelemetry-collector/issues/13822
                type: string
            wait_for_result:
                description: |-
                    WaitForResult determines if incoming requests are blocked until the request is processed or not.
                    Currently, this option is not available when persistent queue is configured using the storage configuration.
                type: boolean
        additionalProperties: false
    start_time:
        description: StartTime is the time when the receiver should start collecting data.
        type: string
        format: date-time
    tags:
        description: Tags are optional tags to attach.
        type: array
        items:
            type: string
    timeout:
        description: Timeout is the maximum time to wait for a response.
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
additionalProperties: false
