$schema: https://json-schema.org/draft/2020-12/schema
title: systemd receiver configuration
type: object
properties:
    metrics:
        type: object
        properties:
            systemd.service.cpu.time:
                type: object
                properties:
                    enabled:
                        type: boolean
                additionalProperties: false
            systemd.service.restarts:
                type: object
                properties:
                    enabled:
                        type: boolean
                additionalProperties: false
            systemd.unit.state:
                type: object
                properties:
                    enabled:
                        type: boolean
                additionalProperties: false
        additionalProperties: false
    resource_attributes:
        type: object
        properties:
            systemd.unit.name:
                type: object
                properties:
                    enabled:
                        type: boolean
                    metrics_exclude:
                        description: |-
                            Experimental: MetricsExclude defines a list of filters for attribute values.
                            If the list is not empty, metrics with matching resource attribute values will not be emitted.
                            MetricsInclude has higher priority than MetricsExclude.
                        type: array
                        items:
                            type: object
                            properties:
                                regexp:
                                    type: string
                                strict:
                                    type: string
                            additionalProperties: false
                    metrics_include:
                        description: |-
                            Experimental: MetricsInclude defines a list of filters for attribute values.
                            If the list is not empty, only metrics with matching resource attribute values will be emitted.
                        type: array
                        items:
                            type: object
                            properties:
                                regexp:
                                    type: string
                                strict:
                                    type: string
                            additionalProperties: false
                additionalProperties: false
        additionalProperties: false
    scope:
        type: string
    units:
        type: array
        items:
            type: string
additionalProperties: false
