$schema: https://json-schema.org/draft/2020-12/schema
title: googlecloudspanner receiver configuration
type: object
properties:
    backfill_enabled:
        type: boolean
    cardinality_total_limit:
        type: integer
    hide_topn_lockstats_rowrangestartkey:
        type: boolean
    projects:
        type: array
        items:
            type: object
            properties:
                instances:
                    type: array
                    items:
                        type: object
                        properties:
                            databases:
                                type: array
                                items:
                                    type: string
                            instance_id:
                                type: string
                        additionalProperties: false
                project_id:
                    type: string
                service_account_key:
                    type: string
            additionalProperties: false
    top_metrics_query_max_rows:
        type: integer
    truncate_text:
        type: boolean
additionalProperties: false
