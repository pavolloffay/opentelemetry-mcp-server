$schema: https://json-schema.org/draft/2020-12/schema
title: googlecloudpubsub exporter configuration
type: object
properties:
    compression:
        description: Compression of the payload (only gzip or is supported, no compression is the default)
        type: string
    enabled:
        description: Enabled indicates whether to not retry sending batches in case of export failure.
        type: boolean
    endpoint:
        description: Override of the Pubsub Endpoint, leave empty for the default endpoint
        type: string
    initial_interval:
        description: InitialInterval the time to wait after the first failure before retrying.
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    insecure:
        description: Only has effect if Endpoint is not ""
        type: boolean
    logs:
        description: LogsSignalConfig allows for custom log configuration
        type: object
        properties:
            attributes:
                description: Attributes are custom Pub/Sub message attributes
                type: object
                additionalProperties:
                    type: string
            encoding:
                description: Encoding is a custom encoding for the marshaling the data onto the message
                type: string
        additionalProperties: false
    max_elapsed_time:
        description: |-
            MaxElapsedTime is the maximum amount of time (including retries) spent trying to send a request/batch.
            Once this value is reached, the data is discarded. If set to 0, the retries are never stopped.
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    max_interval:
        description: |-
            MaxInterval is the upper bound on backoff interval. Once this value is reached the delay between
            consecutive retries will always be `MaxInterval`.
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    metrics:
        description: MetricsSignalConfig allows for custom log configuration
        type: object
        properties:
            attributes:
                description: Attributes are custom Pub/Sub message attributes
                type: object
                additionalProperties:
                    type: string
            encoding:
                description: Encoding is a custom encoding for the marshaling the data onto the message
                type: string
        additionalProperties: false
    multiplier:
        description: Multiplier is the value multiplied by the backoff interval bounds
        type: number
    ordering:
        description: Ordering configures the ordering keys
        type: object
        properties:
            enabled:
                description: Enabled indicates if ordering is enabled
                type: boolean
            from_resource_attribute:
                description: FromResourceAttribute is a resource attribute that will be used as the ordering key.
                type: string
            remove_resource_attribute:
                description: RemoveResourceAttribute indicates if the ordering key should be removed from the resource attributes.
                type: boolean
        additionalProperties: false
    project:
        description: Google Cloud Project ID where the Pubsub client will connect to
        type: string
    randomization_factor:
        description: |-
            RandomizationFactor is a random factor used to calculate next backoffs
            Randomized interval = RetryInterval * (1 ± RandomizationFactor)
        type: number
    sending_queue:
        type: object
    topic:
        description: The fully qualified resource name of the Pubsub topic
        type: string
    traces:
        description: TracesSignalConfig allows for custom log configuration
        type: object
        properties:
            attributes:
                description: Attributes are custom Pub/Sub message attributes
                type: object
                additionalProperties:
                    type: string
            encoding:
                description: Encoding is a custom encoding for the marshaling the data onto the message
                type: string
        additionalProperties: false
    user_agent:
        description: User agent that will be used by the Pubsub client to connect to the service
        type: string
    watermark:
        description: Watermark defines the watermark (the ce-time attribute on the message) behavior
        type: object
        properties:
            allowed_drift:
                description: |-
                    Indication on how much the timestamp can drift from the current time, the timestamp will be capped to the allowed
                    maximum. A duration of 0 is the same as maximum duration
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            behavior:
                description: |-
                    Behavior of the watermark. Currently, only of the message (none, earliest and current, current being the default)
                    will set the timestamp on pubsub based on timestamps of the events inside the message
                type: string
        additionalProperties: false
additionalProperties: false
