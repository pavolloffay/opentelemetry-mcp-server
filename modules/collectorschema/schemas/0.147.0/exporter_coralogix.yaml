$schema: https://json-schema.org/draft/2020-12/schema
title: coralogix exporter configuration
type: object
properties:
    application_name:
        description: Default Coralogix application and subsystem name values.
        type: string
    application_name_attributes:
        description: |-
            Ordered list of Resource attributes that are used for Coralogix
            AppName and SubSystem values. The first non-empty Resource attribute is used.
            Example: AppNameAttributes: ["k8s.namespace.name", "service.namespace"]
            Example: SubSystemAttributes: ["k8s.deployment.name", "k8s.daemonset.name", "service.name"]
        type: array
        items:
            type: string
    domain:
        description: Coralogix domain
        type: string
    domain_settings:
        description: Transport settings used with Domain (supports both gRPC and HTTP)
        type: object
        properties:
            accept_encoding:
                description: |-
                    AcceptEncoding specifies the compression encoding to accept for gRPC responses.
                    Defaults to "gzip" if not set. Only used when protocol is "grpc".
                type: string
            auth:
                description: Auth configuration for outgoing RPCs.
                type: object
                properties:
                    authenticator:
                        description: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
                        type: string
                additionalProperties: false
            authority:
                description: |-
                    WithAuthority parameter configures client to rewrite ":authority" header
                    (godoc.org/google.golang.org/grpc#WithAuthority)
                type: string
            balancer_name:
                description: |-
                    Sets the balancer in grpclb_policy to discover the servers. Default is pick_first.
                    https://github.com/grpc/grpc-go/blob/master/examples/features/load_balancing/README.md
                type: string
            compression:
                description: The compression key for supported compression types within collector.
                type: string
            endpoint:
                description: |-
                    The target to which the exporter is going to send traces or metrics,
                    using the gRPC protocol. The valid syntax is described at
                    https://github.com/grpc/grpc/blob/master/doc/naming.md.
                type: string
            headers:
                description: The headers associated with gRPC requests.
                type: object
            keepalive:
                description: |-
                    The keepalive parameters for gRPC client. See grpc.WithKeepaliveParams.
                    (https://godoc.org/google.golang.org/grpc#WithKeepaliveParams).
                type: object
                properties:
                    permit_without_stream:
                        type: boolean
                    time:
                        type: string
                        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
                    timeout:
                        type: string
                        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
                additionalProperties: false
            middlewares:
                description: Middlewares for the gRPC client.
                type: array
                items:
                    type: object
                    properties:
                        id:
                            description: ID specifies the name of the extension to use.
                            type: string
                    additionalProperties: false
            proxy_url:
                description: The following fields are only used when protocol is "http"
                type: string
            read_buffer_size:
                description: |-
                    ReadBufferSize for gRPC client. See grpc.WithReadBufferSize.
                    (https://godoc.org/google.golang.org/grpc#WithReadBufferSize).
                type: integer
            timeout:
                description: Used only if protocol is http
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            tls:
                description: TLS struct exposes TLS client configuration.
                type: object
                properties:
                    ca_file:
                        description: |-
                            Path to the CA cert. For a client this verifies the server certificate.
                            For a server this verifies client certificates. If empty uses system root CA.
                            (optional)
                        type: string
                    ca_pem:
                        description: In memory PEM encoded cert. (optional)
                        type: string
                    cert_file:
                        description: Path to the TLS cert to use for TLS required connections. (optional)
                        type: string
                    cert_pem:
                        description: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
                        type: string
                    cipher_suites:
                        description: |-
                            CipherSuites is a list of TLS cipher suites that the TLS transport can use.
                            If left blank, a safe default list is used.
                            See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
                        type: array
                        items:
                            type: string
                    curve_preferences:
                        description: |-
                            contains the elliptic curves that will be used in
                            an ECDHE handshake, in preference order
                            Defaults to empty list and "crypto/tls" defaults are used, internally.
                        type: array
                        items:
                            type: string
                    include_system_ca_certs_pool:
                        description: |-
                            If true, load system CA certificates pool in addition to the certificates
                            configured in this struct.
                        type: boolean
                    insecure:
                        description: |-
                            In gRPC and HTTP when set to true, this is used to disable the client transport security.
                            See https://godoc.org/google.golang.org/grpc#WithInsecure for gRPC.
                            Please refer to https://godoc.org/crypto/tls#Config for more information.
                            (optional, default false)
                        type: boolean
                    insecure_skip_verify:
                        description: InsecureSkipVerify will enable TLS but not verify the certificate.
                        type: boolean
                    key_file:
                        description: Path to the TLS key to use for TLS required connections. (optional)
                        type: string
                    key_pem:
                        description: In memory PEM encoded TLS key to use for TLS required connections. (optional)
                        type: string
                    max_version:
                        description: |-
                            MaxVersion sets the maximum TLS version that is acceptable.
                            If not set, refer to crypto/tls for defaults. (optional)
                        type: string
                    min_version:
                        description: |-
                            MinVersion sets the minimum TLS version that is acceptable.
                            If not set, TLS 1.2 will be used. (optional)
                        type: string
                    reload_interval:
                        description: |-
                            ReloadInterval specifies the duration after which the certificate will be reloaded
                            If not set, it will never be reloaded (optional)
                        type: string
                        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
                    server_name_override:
                        description: |-
                            ServerName requested by client for virtual hosting.
                            This sets the ServerName in the TLSConfig. Please refer to
                            https://godoc.org/crypto/tls#Config for more information. (optional)
                        type: string
                    tpm:
                        description: Trusted platform module configuration
                        type: object
                        properties:
                            auth:
                                type: string
                            enabled:
                                type: boolean
                            owner_auth:
                                type: string
                            path:
                                description: |-
                                    The path to the TPM device or Unix domain socket.
                                    For instance /dev/tpm0 or /dev/tpmrm0.
                                type: string
                        additionalProperties: false
                additionalProperties: false
            wait_for_ready:
                description: |-
                    WaitForReady parameter configures client to wait for ready state before sending data.
                    (https://github.com/grpc/grpc/blob/master/doc/wait-for-ready.md)
                type: boolean
            write_buffer_size:
                description: |-
                    WriteBufferSize for gRPC gRPC. See grpc.WithWriteBufferSize.
                    (https://godoc.org/google.golang.org/grpc#WithWriteBufferSize).
                type: integer
        additionalProperties: false
    enabled:
        description: Enabled indicates whether to not retry sending batches in case of export failure.
        type: boolean
    initial_interval:
        description: InitialInterval the time to wait after the first failure before retrying.
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    logs:
