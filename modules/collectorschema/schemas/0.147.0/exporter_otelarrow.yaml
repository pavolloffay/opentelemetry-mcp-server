$schema: https://json-schema.org/draft/2020-12/schema
title: otelarrow exporter configuration
type: object
properties:
    arrow:
        description: Arrow includes settings specific to OTel Arrow.
        type: object
        properties:
            disable_downgrade:
                description: |-
                    DisableDowngrade prevents this exporter from fallback back
                    to standard OTLP.  If the Arrow service is unavailable, it
                    will retry and/or fail.
                type: boolean
            disabled:
                description: |-
                    Disabled prevents using OTel-Arrow streams.  The exporter
                    falls back to standard OTLP.
                type: boolean
            max_stream_lifetime:
                description: |-
                    MaxStreamLifetime should be set to less than the value of
                    grpc: keepalive: max_connection_age_grace plus the timeout.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            num_streams:
                description: NumStreams determines the number of OTel Arrow streams.
                type: integer
            payload_compression:
                description: |-
                    PayloadCompression is applied on the Arrow IPC stream
                    internally and may have different results from using
                    gRPC-level compression.  This is disabled by default, since
                    gRPC-level compression is enabled by default.  This can be
                    set to "zstd" to turn on Arrow-Zstd compression.
                    Note that `Zstd` applies to gRPC, not Arrow compression.
                type: string
            prioritizer:
                description: |-
                    Prioritizer is a policy name for how load is distributed
                    across streams.
                type: string
            zstd:
                description: |-
                    Zstd settings apply to OTel-Arrow use of gRPC specifically.
                    Note that when multiple Otel-Arrow exporters are configured
                    their settings will be applied in arbitrary order.
                    Identical Zstd settings are recommended when multiple
                    OTel-Arrow exporters are in use.
                type: object
                properties:
                    concurrency:
                        description: |-
                            Concurrency is a Zstd-library parameter that configures the
                            use of background goroutines to improve compression speed.
                            0 means to let the library decide (it will use up to GOMAXPROCS),
                            and 1 means to avoid background workers.  (default: 1)
                            See `zstdlib.WithEncoderConcurrency()`.
                        type: integer
                    level:
                        description: |-
                            Level is meaningful in the range [0, 10].  No invalid
                            values, they all map into 4 default configurations.  (default: 5)
                            See `zstdlib.WithEncoderLevel()`.
                        type: integer
                    window_size_mib:
                        description: |-
                            WindowSizeMiB is a Zstd-library parameter that controls how
                            much window of text is visible to the compressor at a time.
                            It is the dominant factor that determines memory usage.
                            If zero, the window size is determined by level.  (default: 0)
                            See `zstdlib.WithWindowSize()`.
                        type: integer
                additionalProperties: false
        additionalProperties: false
    auth:
        description: Auth configuration for outgoing RPCs.
        type: object
        properties:
            authenticator:
                description: AuthenticatorID specifies the name of the extension to use in order to authenticate the incoming data point.
                type: string
        additionalProperties: false
    authority:
        description: |-
            WithAuthority parameter configures client to rewrite ":authority" header
            (godoc.org/google.golang.org/grpc#WithAuthority)
        type: string
    balancer_name:
        description: |-
            Sets the balancer in grpclb_policy to discover the servers. Default is pick_first.
            https://github.com/grpc/grpc-go/blob/master/examples/features/load_balancing/README.md
        type: string
    compression:
        description: The compression key for supported compression types within collector.
        type: string
    endpoint:
        description: |-
            The target to which the exporter is going to send traces or metrics,
            using the gRPC protocol. The valid syntax is described at
            https://github.com/grpc/grpc/blob/master/doc/naming.md.
        type: string
    headers:
        description: The headers associated with gRPC requests.
        type: object
    keepalive:
        description: |-
            The keepalive parameters for gRPC client. See grpc.WithKeepaliveParams.
            (https://godoc.org/google.golang.org/grpc#WithKeepaliveParams).
        type: object
        properties:
            permit_without_stream:
                type: boolean
            time:
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            timeout:
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
        additionalProperties: false
    metadata_cardinality_limit:
        description: |-
            MetadataCardinalityLimit indicates the maximum number of
            exporter instances that will be created through a distinct
            combination of MetadataKeys.
        type: integer
    metadata_keys:
        description: |-
            MetadataKeys is a list of client.Metadata keys that will be
            used to form distinct exporters.  If this setting is empty,
            a single exporter instance will be used.  When this setting
            is not empty, one exporter will be used per distinct
            combination of values for the listed metadata keys.

            Empty value and unset metadata are treated as distinct cases.

            Entries are case-insensitive.  Duplicated entries will
            trigger a validation error.
        type: array
        items:
            type: string
    middlewares:
        description: Middlewares for the gRPC client.
        type: array
        items:
            type: object
            properties:
                id:
                    description: ID specifies the name of the extension to use.
                    type: string
            additionalProperties: false
    read_buffer_size:
        description: |-
            ReadBufferSize for gRPC client. See grpc.WithReadBufferSize.
            (https://godoc.org/google.golang.org/grpc#WithReadBufferSize).
        type: integer
    retry_on_failure:
        type: object
        properties:
            enabled:
                description: Enabled indicates whether to not retry sending batches in case of export failure.
                type: boolean
            initial_interval:
                description: InitialInterval the time to wait after the first failure before retrying.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            max_elapsed_time:
                description: |-
                    MaxElapsedTime is the maximum amount of time (including retries) spent trying to send a request/batch.
                    Once this value is reached, the data is discarded. If set to 0, the retries are never stopped.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            max_interval:
                description: |-
                    MaxInterval is the upper bound on backoff interval. Once this value is reached the delay between
                    consecutive retries will always be `MaxInterval`.
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            multiplier:
                description: Multiplier is the value multiplied by the backoff interval bounds
                type: number
            randomization_factor:
                description: |-
                    RandomizationFactor is a random factor used to calculate next backoffs
                    Randomized interval = RetryInterval * (1 ± RandomizationFactor)
                type: number
        additionalProperties: false
    sending_queue:
        type: object
    tls:
        description: TLS struct exposes TLS client configuration.
        type: object
        properties:
            ca_file:
                description: |-
                    Path to the CA cert. For a client this verifies the server certificate.
                    For a server this verifies client certificates. If empty uses system root CA.
                    (optional)
                type: string
            ca_pem:
                description: In memory PEM encoded cert. (optional)
                type: string
            cert_file:
                description: Path to the TLS cert to use for TLS required connections. (optional)
                type: string
            cert_pem:
                description: In memory PEM encoded TLS cert to use for TLS required connections. (optional)
                type: string
            cipher_suites:
                description: |-
                    CipherSuites is a list of TLS cipher suites that the TLS transport can use.
                    If left blank, a safe default list is used.
                    See https://go.dev/src/crypto/tls/cipher_suites.go for a list of supported cipher suites.
                type: array
                items:
                    type: string
            curve_preferences:
                description: |-
                    contains the elliptic curves that will be used in
                    an ECDHE handshake, in preference order
                    Defaults to empty list and "crypto/tls" defaults are used, internally.
                type: array
                items:
                    type: string
            include_system_ca_certs_pool:
                description: |-
                    If true, load system CA certificates pool in addition to the certificates
                    configured in this struct.
                type: boolean
            insecure:
                description: |-
                    In gRPC and HTTP when set to true, this is used to disable the client transport security.
                    See https://godoc.org/google.golang.org/grpc#WithInsecure for gRPC.
                    Please refer to https://godoc.org/crypto/tls#Config for more information.
                    (optional, default false)
                type: boolean
            insecure_skip_verify:
                description: InsecureSkipVerify will enable TLS but not verify the certificate.
                type: boolean
            key_file:
                description: Path to the TLS key to use for TLS required connections. (optional)
                type: string
            key_pem:
                description: In memory PEM encoded TLS key to use for TLS required connections. (optional)
                type: string
            max_version:
                description: |-
                    MaxVersion sets the maximum TLS version that is acceptable.
                    If not set, refer to crypto/tls for defaults. (optional)
                type: string
            min_version:
                description: |-
                    MinVersion sets the minimum TLS version that is acceptable.
                    If not set, TLS 1.2 will be used. (optional)
                type: string
            reload_interval:
                description: |-
                    ReloadInterval specifies the duration after which the certificate will be reloaded
                    If not set, it will never be reloaded (optional)
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            server_name_override:
                description: |-
                    ServerName requested by client for virtual hosting.
                    This sets the ServerName in the TLSConfig. Please refer to
                    https://godoc.org/crypto/tls#Config for more information. (optional)
                type: string
            tpm:
                description: Trusted platform module configuration
                type: object
                properties:
                    auth:
                        type: string
                    enabled:
                        type: boolean
                    owner_auth:
                        type: string
                    path:
                        description: |-
                            The path to the TPM device or Unix domain socket.
                            For instance /dev/tpm0 or /dev/tpmrm0.
                        type: string
                additionalProperties: false
        additionalProperties: false
    wait_for_ready:
        description: |-
            WaitForReady parameter configures client to wait for ready state before sending data.
            (https://github.com/grpc/grpc/blob/master/doc/wait-for-ready.md)
        type: boolean
    write_buffer_size:
        description: |-
            WriteBufferSize for gRPC gRPC. See grpc.WithWriteBufferSize.
            (https://godoc.org/google.golang.org/grpc#WithWriteBufferSize).
        type: integer
additionalProperties: false
