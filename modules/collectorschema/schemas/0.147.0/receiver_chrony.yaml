$schema: https://json-schema.org/draft/2020-12/schema
title: chrony receiver configuration
type: object
properties:
    endpoint:
        description: |-
            Endpoint is the published address or unix socket
            that allows clients to connect to:
            The allowed format is:
              unix:///path/to/chronyd/unix.sock
              udp://localhost:323

            The default value is unix:///var/run/chrony/chronyd.sock
        type: string
    metrics:
        type: object
        properties:
            ntp.frequency.offset:
                type: object
                properties:
                    enabled:
                        type: boolean
                additionalProperties: false
            ntp.skew:
                type: object
                properties:
                    enabled:
                        type: boolean
                additionalProperties: false
            ntp.stratum:
                type: object
                properties:
                    enabled:
                        type: boolean
                additionalProperties: false
            ntp.time.correction:
                type: object
                properties:
                    enabled:
                        type: boolean
                additionalProperties: false
            ntp.time.last_offset:
                type: object
                properties:
                    enabled:
                        type: boolean
                additionalProperties: false
            ntp.time.rms_offset:
                type: object
                properties:
                    enabled:
                        type: boolean
                additionalProperties: false
            ntp.time.root_delay:
                type: object
                properties:
                    enabled:
                        type: boolean
                additionalProperties: false
        additionalProperties: false
additionalProperties: false
