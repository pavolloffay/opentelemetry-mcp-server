$schema: https://json-schema.org/draft/2020-12/schema
title: pulsar exporter configuration
type: object
properties:
    auth:
        type: object
        properties:
            athenz:
                type: object
                properties:
                    key_id:
                        type: string
                    principal_header:
                        type: string
                    private_key:
                        type: string
                    provider_domain:
                        type: string
                    tenant_domain:
                        type: string
                    tenant_service:
                        type: string
                    zts_url:
                        type: string
                additionalProperties: false
            oauth2:
                type: object
                properties:
                    audience:
                        type: string
                    client_id:
                        type: string
                    issuer_url:
                        type: string
                    private_key:
                        type: string
                    scope:
                        type: string
                additionalProperties: false
            tls:
                type: object
                properties:
                    cert_file:
                        type: string
                    key_file:
                        type: string
                additionalProperties: false
            token:
                type: object
                properties:
                    token:
                        type: string
                additionalProperties: false
        additionalProperties: false
    connection_timeout:
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    enabled:
        description: Enabled indicates whether to not retry sending batches in case of export failure.
        type: boolean
    encoding:
        description: Encoding of messages (default "otlp_proto")
        type: string
    endpoint:
        description: Endpoint of pulsar broker (default "pulsar://localhost:6650")
        type: string
    initial_interval:
        description: InitialInterval the time to wait after the first failure before retrying.
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    max_connections_per_broker:
        type: integer
    max_elapsed_time:
        description: |-
            MaxElapsedTime is the maximum amount of time (including retries) spent trying to send a request/batch.
            Once this value is reached, the data is discarded. If set to 0, the retries are never stopped.
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    max_interval:
        description: |-
            MaxInterval is the upper bound on backoff interval. Once this value is reached the delay between
            consecutive retries will always be `MaxInterval`.
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    multiplier:
        description: Multiplier is the value multiplied by the backoff interval bounds
        type: number
    operation_timeout:
        type: string
        pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
    producer:
        description: Producer configuration of the Pulsar producer
        type: object
        properties:
            batch_builder_type:
                type: string
            batching_max_messages:
                type: integer
            batching_max_publish_delay:
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
            batching_max_size:
                type: integer
            compression_level:
                type: string
            compression_type:
                type: string
            disable_batching:
                type: boolean
            disable_block_if_queue_full:
                type: boolean
            hashing_scheme:
                type: string
            max_pending_messages:
                type: integer
            max_reconnect_broker:
                type: integer
            partitions_auto_discovery_interval:
                type: string
                pattern: ^(0|[-+]?((\d+(\.\d*)?|\.\d+)(ns|us|µs|μs|ms|s|m|h))+)$
        additionalProperties: false
    randomization_factor:
        description: |-
            RandomizationFactor is a random factor used to calculate next backoffs
            Randomized interval = RetryInterval * (1 ± RandomizationFactor)
        type: number
    sending_queue:
        type: object
    tls_allow_insecure_connection:
        description: 'Configure whether the Pulsar client accept untrusted TLS certificate from broker (default: false)'
        type: boolean
    tls_trust_certs_file_path:
        description: Set the path to the trusted TLS certificate file
        type: string
    topic:
        description: The name of the pulsar topic to export to (default otlp_spans for traces, otlp_metrics for metrics)
        type: string
additionalProperties: false
