$schema: https://json-schema.org/draft/2020-12/schema
title: windowsperfcounters receiver configuration
type: object
properties:
    metrics:
        type: object
        additionalProperties:
            type: object
    perfcounters:
        type: array
        items:
            type: object
            properties:
                counters:
                    type: array
                    items:
                        type: object
                        properties:
                            attributes:
                                type: object
                                additionalProperties:
                                    type: string
                            metric:
                                type: string
                            name:
                                type: string
                            recreate_query:
                                type: boolean
                        additionalProperties: false
                instances:
                    type: array
                    items:
                        type: string
                object:
                    type: string
            additionalProperties: false
additionalProperties: false
